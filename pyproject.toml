[project]
name = "snap-tap"
version = "0.1.0"
description = "Standalone phone snap/tap CLI and primitive runtime for safe agent operation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Kamil" }]
keywords = [
    "android",
    "automation",
    "ios",
    "mobile",
    "screenshots",
    "uiautomator",
    "webdriveragent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "adbutils>=2.9,<3",
    "lxml>=5,<7",
    "pillow>=11,<12",
    "typer>=0.16,<1",
    "uiautomator2>=3.3,<4",
]

[project.scripts]
snap-tap = "snap_tap.cli.app:app"

[project.urls]
Homepage = "https://github.com/HAKAR-OS/snap-tap"
Repository = "https://github.com/HAKAR-OS/snap-tap"
Issues = "https://github.com/HAKAR-OS/snap-tap/issues"
Changelog = "https://github.com/HAKAR-OS/snap-tap/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snap_tap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests/unit/shared", "tests/unit/cli"]
