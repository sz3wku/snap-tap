name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Show tool versions
        run: |
          python --version
          uv --version

      - name: Check lockfile
        run: uv lock --check

      - name: Run tests
        run: uv run pytest

      - name: Run ruff
        run: uv run ruff check src tests

      - name: Run mypy
        run: uv run mypy --explicit-package-bases src tests

      - name: Build package
        run: uv build --out-dir temp/build-check
