name: Bug report
description: Report a reproducible snap-tap bug.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include raw screenshots, raw XML, typed private text, tokens, account data, or full local paths.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Include exact commands and sanitized output.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Device Platform
      options:
        - Android
        - iOS
        - Both
        - Unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: snap-tap Version or Commit
      placeholder: "0.1.0 / commit SHA"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "3.11.15"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host OS
      placeholder: "Windows 11 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety Check
      options:
        - label: I removed raw screenshots, raw XML, typed private text, tokens, account data, and full local paths.
          required: true
        - label: I used an explicit device id if multiple devices were connected.
          required: false
